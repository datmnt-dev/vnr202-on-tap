<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172e27">
  <title>Ôn tập VNR202 · Lịch sử Đảng</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="questions.js"></script>
  <script defer src="quiz.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><div><strong>VNR202</strong><span>Lịch sử Đảng</span></div></div>
      <nav class="modes" aria-label="Chế độ học">
        <button id="study-mode" type="button" aria-pressed="true">Học toàn bộ</button>
        <button id="review-mode" type="button" aria-pressed="false">Ôn câu sai <span id="review-count">0</span></button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <h1 id="page-title">Ôn tập trắc nghiệm</h1>
      <p id="page-description"></p>
    </div>
    <div class="layout">
      <section id="stage" class="stage" aria-label="Khu vực trả lời"></section>

      <aside class="sidebar" aria-label="Tiến độ và danh sách câu hỏi">
        <section class="progress-card" aria-labelledby="progress-title">
          <h2 id="progress-title">Tiến độ học</h2>
          <p class="tally"><strong id="progress-value">0</strong><span id="progress-total"></span></p>
          <progress id="progress-bar" value="0" max="1" aria-label="Số câu đã trả lời"></progress>
          <p id="progress-caption" class="progress-caption">Câu đã trả lời</p>
          <dl class="stats">
            <div><dt>Đúng</dt><dd id="correct-count">0</dd></div>
            <div><dt>Sai lượt đầu</dt><dd id="wrong-count">0</dd></div>
          </dl>
        </section>

        <details id="question-map" class="map" open>
          <summary>Danh sách câu <span id="map-count"></span></summary>
          <div id="question-grid" class="question-grid" aria-label="Chuyển đến câu hỏi"></div>
          <div class="legend" id="legend">
            <span><i class="dot done"></i> Đúng</span>
            <span><i class="dot missed"></i> Sai</span>
            <span><i class="dot cleared"></i> Đã ôn</span>
            <span><i class="dot neutral"></i> Đã làm</span>
          </div>
        </details>
        <p id="save-status" class="save-status" role="status">Tiến độ được lưu trên trình duyệt này.</p>
      </aside>
    </div>
    <footer class="footer"><span>Nguồn câu hỏi và đáp án · VNR.docx</span><span class="keyboard-help"><kbd>1</kbd>–<kbd>5</kbd> chọn đáp án <span>·</span> <kbd>Enter</kbd> tiếp tục</span></footer>
  </main>

  <template id="question-template">
    <article class="card appear">
      <div class="question-meta"><span class="question-number"></span><span class="question-type"></span></div>
      <h2 class="prompt" tabindex="-1"></h2>
      <div class="options" role="group" aria-label="Các phương án"></div>
      <div class="feedback" role="status" aria-atomic="true"></div>
      <div class="actions">
        <button type="button" class="secondary previous">← <span>Câu trước</span></button>
        <button type="button" class="primary next"></button>
      </div>
    </article>
  </template>
</body>
</html>
